<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reports - InventoryPro</title>
    <link rel="stylesheet" href="css/style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-brand">
            <span class="brand-icon">📦</span>
            <span class="brand-text">InventoryPro</span>
        </div>
        <nav class="sidebar-nav">
            <a href="dashboard.html">
                <span class="nav-icon">📊</span>
                <span>Dashboard</span>
            </a>
            <a href="products.html">
                <span class="nav-icon">📦</span>
                <span>Products</span>
            </a>
            <a href="suppliers.html">
                <span class="nav-icon">🏷️</span>
                <span>Suppliers</span>
            </a>
            <a href="inventory.html">
                <span class="nav-icon">🔄</span>
                <span>Stock Transaction</span>
            </a>
            <a href="reports.html">
                <span class="nav-icon">📈</span>
                <span>Inventory</span>
            </a>
        </nav>
        <div class="sidebar-footer">
            <button id="logoutBtn" class="btn btn-outline btn-small">Logout</button>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <header class="top-bar">
            <h1>Reports</h1>
            <div class="top-bar-right">
                <button id="refreshReports" class="btn btn-outline btn-small">🔄 Refresh</button>
                <span class="user-name" id="userName">User</span>
                <span class="user-avatar">👤</span>
            </div>
        </header>


        <!-- Low Stock Items -->
        <div class="report-section">
            <h2>Low Stock Items</h2>
            <div class="table-container">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Product Name</th>
                            <th>Current Stock</th>
                            <th>Threshold</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="lowStockTableBody">
                        <tr>
                            <td colspan="5" class="text-center">Loading low stock items...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Recent Reports -->
        <div class="report-section">
            <h2>inventory Reports</h2>
            <div class="report-cards" id="reportCards">
                <p class="no-reports">No reports generated yet</p>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/reports.js"></script>
</body>
</html>
