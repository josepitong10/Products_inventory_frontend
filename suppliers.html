<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Suppliers - InventoryPro</title>
    <link rel="stylesheet" href="css/style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-brand">
            <span class="brand-icon">📦</span>
            <span class="brand-text">InventoryPro</span>
        </div>
        <nav class="sidebar-nav">
            <a href="dashboard.html">
                <span class="nav-icon">📊</span>
                <span>Dashboard</span>
            </a>
            <a href="products.html">
                <span class="nav-icon">📦</span>
                <span>Products</span>
            </a>
            <a href="suppliers.html" class="active">
                <span class="nav-icon">🏷️</span>
                <span>Suppliers</span>
            </a>
            <a href="inventory.html">
                <span class="nav-icon">🔄</span>
                <span>Inventory</span>
            </a>
            <a href="reports.html">
                <span class="nav-icon">📈</span>
                <span>Reports</span>
            </a>
        </nav>
        <div class="sidebar-footer">
            <button id="logoutBtn" class="btn btn-outline btn-small">Logout</button>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <header class="top-bar">
            <h1>Suppliers</h1>
            <div class="top-bar-right">
                <button id="addSupplierBtn" class="btn btn-primary">+ Add Supplier</button>
                <span class="user-avatar">👤</span>
            </div>
        </header>

        <!-- Suppliers Table -->
        <div class="table-container">
            <div class="table-header">
                <div class="search-box">
                    <input type="text" id="searchSupplier" placeholder="Search suppliers..." />
                </div>
            </div>
            <table class="data-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Contact</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Address</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="suppliersTableBody">
                    <tr>
                        <td colspan="7" class="text-center">Loading suppliers...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Supplier Modal -->
    <div id="supplierModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Add Supplier</h2>
                <button class="modal-close">&times;</button>
            </div>
            <form id="supplierForm">
                <input type="hidden" id="supplierId" />
                <div class="form-group">
                    <label for="supplierName">Supplier Name</label>
                    <input type="text" id="supplierName" required />
                </div>
                <div class="form-group">
                    <label for="supplierContact">Contact Person</label>
                    <input type="text" id="supplierContact" />
                </div>
                <div class="form-group">
                    <label for="supplierEmail">Email</label>
                    <input type="email" id="supplierEmail" required />
                </div>
                <div class="form-group">
                    <label for="supplierPhone">Phone</label>
                    <input type="tel" id="supplierPhone" />
                </div>
                <div class="form-group">
                    <label for="supplierAddress">Address</label>
                    <input type="text" id="supplierAddress" />
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-outline modal-close">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Supplier</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/suppliers.js"></script>
</body>
</html>
