<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Products - InventoryPro</title>
    <link rel="stylesheet" href="css/style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-brand">
            <span class="brand-icon">📦</span>
            <span class="brand-text">InventoryPro</span>
        </div>
        <nav class="sidebar-nav">
            <a href="dashboard.html">
                <span class="nav-icon">📊</span>
                <span>Dashboard</span>
            </a>
            <a href="products.html" class="active">
                <span class="nav-icon">📦</span>
                <span>Products</span>
            </a>
            <a href="suppliers.html">
                <span class="nav-icon">🏷️</span>
                <span>Suppliers</span>
            </a>
            <a href="inventory.html">
                <span class="nav-icon">🔄</span>
                <span>Stock Transaction</span>
            </a>
            <a href="reports.html">
                <span class="nav-icon">📈</span>
                <span>Inventory</span>
            </a>
        </nav>
        <div class="sidebar-footer">
            <button id="logoutBtn" class="btn btn-outline btn-small">Logout</button>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <header class="top-bar">
            <h1>Products</h1>
            <div class="top-bar-right">
                <button id="addProductBtn" class="btn btn-primary">+ Add Product</button>
                <span class="user-name" id="userName">User</span>
                <span class="user-avatar">👤</span>
            </div>
        </header>


        <!-- Products Table -->
        <div class="table-container">
            <div class="table-header">
                <div class="search-box">
                    <input type="text" id="searchProduct" placeholder="Search products..." />
                </div>
                <div class="table-actions">
                    <button id="refreshProducts" class="btn btn-outline btn-small">🔄 Refresh</button>
                </div>
            </div>
            <table class="data-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Description</th>
                        <th>Category</th>
                        <th>Price</th>
                        <th>Stock</th>
                        <th>Supplier</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="productsTableBody">
                    <tr>
                        <td colspan="8" class="text-center">Loading products...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Product Modal -->
    <!-- Product Modal -->
<div id="productModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="modalTitle">Add Product</h2>
            <button class="modal-close">&times;</button>
        </div>

        <form id="productForm">
            <input type="hidden" id="productId" />

            <div class="form-group">
                <label for="productName">Product Name</label>
                <input
                    type="text"
                    id="productName"
                    placeholder="Enter product name"
                    required
                />
            </div>

            <div class="form-group">
                <label for="productCategory">Category</label>
                <select id="productCategory" required>
                    <option value="">Select a category</option>
                </select>
            </div>

            <div class="form-group">
                <label for="productSupplier">Supplier</label>
                <select id="productSupplier" required>
                    <option value="">Select a supplier</option>
                </select>
            </div>

            <div class="form-group">
                <label for="productPrice">Price</label>
                <input
                    type="number"
                    id="productPrice"
                    step="0.01"
                    min="0"
                    placeholder="Enter price"
                    required
                />
            </div>

            <div class="form-group">
                <label for="productStock">Stock Quantity</label>
                <input
                    type="number"
                    id="productStock"
                    min="0"
                    placeholder="Enter stock quantity"
                    required
                />
            </div>

            <div class="form-group">
                <label for="productLowStock">Low Stock Threshold</label>
                <input
                    type="number"
                    id="productLowStock"
                    min="0"
                    value="5"
                    required
                />
            </div>

            <div class="form-group">
                <label for="productDescription">Description</label>
                <textarea
                    id="productDescription"
                    rows="3"
                    placeholder="Enter product description"
                ></textarea>
            </div>

            <div class="modal-actions">
                <button
                    type="button"
                    class="btn btn-outline modal-close"
                >
                    Cancel
                </button>

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Save Product
                </button>
            </div>
        </form>
    </div>
</div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/products.js"></script>
</body>
</html>
