<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inventory - InventoryPro</title>
    <link rel="stylesheet" href="css/style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-brand">
            <span class="brand-icon">📦</span>
            <span class="brand-text">InventoryPro</span>
        </div>
        <nav class="sidebar-nav">
            <a href="dashboard.html">
                <span class="nav-icon">📊</span>
                <span>Dashboard</span>
            </a>
            <a href="products.html">
                <span class="nav-icon">📦</span>
                <span>Products</span>
            </a>
            <a href="suppliers.html">
                <span class="nav-icon">🏷️</span>
                <span>Suppliers</span>
            </a>
            <a href="inventory.html" class="active">
                <span class="nav-icon">🔄</span>
                <span>Inventory</span>
            </a>
            <a href="reports.html">
                <span class="nav-icon">📈</span>
                <span>Reports</span>
            </a>
        </nav>
        <div class="sidebar-footer">
            <button id="logoutBtn" class="btn btn-outline btn-small">Logout</button>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <header class="top-bar">
            <h1>Inventory Management</h1>
            <div class="top-bar-right">
                <span class="user-name" id="userName">User</span>
                <span class="user-avatar">👤</span>
            </div>
        </header>


        <!-- Transaction Panel -->
        <div class="transaction-panel">
            <h2>Record Transaction</h2>
            <form id="transactionForm" class="transaction-form">
                <div class="form-group">
                    <label for="transactionProduct">Product</label>
                    <select id="transactionProduct" required>
                        <option value="">Select a product</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="transactionType">Type</label>
                    <select id="transactionType" required>
                        <option value="in">Stock In</option>
                        <option value="out">Stock Out</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="transactionQuantity">Quantity</label>
                    <input type="number" id="transactionQuantity" required />
                </div>
                <div class="form-group">
                    <label for="transactionNote">Note</label>
                    <input type="text" id="transactionNote" placeholder="Optional note" />
                </div>
                <button type="submit" class="btn btn-primary">Record Transaction</button>
            </form>
        </div>

        <!-- Transaction History -->
        <div class="transaction-history">
            <h2>Transaction History</h2>
            <div class="table-container">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Product</th>
                            <th>Type</th>
                            <th>Quantity</th>
                            <th>Date</th>
                            <th>Note</th>
                        </tr>
                    </thead>
                    <tbody id="transactionsTableBody">
                        <tr>
                            <td colspan="6" class="text-center">Loading transactions...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/inventory.js"></script>
</body>
</html>
